<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monroe Student Portal | Reset Password</title><style>body{font:16px system-ui;background:#f4f7f5;color:#163024;margin:0}main{max-width:480px;background:white;padding:30px;border-radius:15px;margin:8vh auto;box-shadow:0 4px 24px #0001}label{display:block;margin:15px 0 6px}input,button{box-sizing:border-box;width:100%;padding:13px;font:inherit;border-radius:8px;border:1px solid #a8b9af}button{background:#07694d;color:white;margin-top:16px;cursor:pointer}p{line-height:1.5}.small{color:#54695c;font-size:14px}#msg{min-height:24px}a{color:#07694d}</style></head><body><main><h1>Reset your password</h1><p class="small">This page is for a recovery link sent to your verified student email address.</p><form id="form"><label for="pass">New password (12 characters minimum)</label><input id="pass" type="password" autocomplete="new-password" minlength="12" required><label for="confirm">Confirm new password</label><input id="confirm" type="password" autocomplete="new-password" minlength="12" required><button type="submit">Save new password</button></form><p id="msg" role="status"></p><a href="https://monroeu.github.io/student/">Return to Student Portal</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const u='https://irnrjzeejalbbqdrbzmj.supabase.co',k='sb_publishable_aj2vpjfJrSMvjTxcKuC0pQ_pf7JbDo2';
const sb=window.supabase.createClient(u,k,{auth:{storageKey:'sb-irnrjzeejalbbqdrbzmj-auth-token',persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const msg=document.getElementById('msg');let recovery=false;
sb.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY')recovery=true});
(async()=>{const p=new URLSearchParams(location.search);if(p.has('token_hash')&&p.get('type')==='recovery'){const {error}=await sb.auth.verifyOtp({token_hash:p.get('token_hash'),type:'recovery'});if(error)msg.textContent='Recovery link invalid or expired. Request a new one.';else recovery=true}})();
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const a=document.getElementById('pass').value,b=document.getElementById('confirm').value;if(a!==b){msg.textContent='Passwords do not match';return}if(a.length<12){msg.textContent='Use at least 12 characters';return}const {data:{session}}=await sb.auth.getSession();if(!session||!recovery){msg.textContent='Open a valid recovery link from your email first.';return}const {error}=await sb.auth.updateUser({password:a});if(error){msg.textContent=error.message;return}await sb.auth.signOut();msg.textContent='Password updated. Return to the Student Portal and sign in with your Student ID.';document.getElementById('form').hidden=true;history.replaceState({},'',location.pathname)});
</script></body></html>
